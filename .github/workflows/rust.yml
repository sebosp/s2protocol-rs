name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: rui314/setup-mold@v1
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests with the Arrow snapshot and the textures
      run: cargo test --verbose --features dep_arrow,textures
    # The replays are read in browsers too, i.e. by cooper, from the dropped file contents.
    - name: Build for WebAssembly
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --verbose --target wasm32-unknown-unknown --features textures
